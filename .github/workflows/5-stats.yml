# TỰ SINH bằng tools/public_runner/make_public.py từ .github/workflows/5-stats.yml của kho private. Đừng sửa tay: sửa file gốc rồi sinh lại.
# Chạy ở kho public (miễn phí), đọc/ghi dữ liệu ở kho private bằng secret PRIVATE_REPO_TOKEN.
name: 5 - So lieu thong ke

# Xoài Studio → Thống kê. Mỗi sáng 9:35 (giờ VN) đọc số liệu các video đã đăng (lượt xem, thời gian xem,
# thích, bình luận, chia sẻ, lưu, theo dõi mới) và số người theo dõi của từng kênh Facebook / Instagram.
# Chỉ đọc, không đăng gì. Ghi vào state/stats/.
on:
  schedule:
    - cron: "35 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: phatnh91/fashion-affiliate-reels
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - id: m
        run: |
          python3 - <<'PY'
          import json, os
          cfg = json.load(open("channels.json", encoding="utf-8"))
          chans = [c for c in cfg["channels"] if c.get("type") in ("facebook", "instagram")]
          for c in chans:
              c["page_id_secret"] = c.get("page_id_secret") or "NONE"
              c["token_secret"] = c.get("token_secret") or "NONE"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps(chans or [{"id": "none", "type": "none", "name": "none", "page_id_secret": "NONE", "token_secret": "NONE"}], ensure_ascii=False) + "\n")
          PY

  stats:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: phatnh91/fashion-affiliate-reels
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Đọc số liệu
        env:
          CHANNEL_JSON: ${{ toJSON(matrix) }}
          TOKEN: ${{ secrets[matrix.token_secret] }}
          PAGE_ID: ${{ secrets[matrix.page_id_secret] }}
        run: python src/insights.py
      - name: Lưu
        run: |
          git config user.name "fashion-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/stats 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Số liệu thống kê ${{ matrix.id }} [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((i*5)); done
          exit 1
